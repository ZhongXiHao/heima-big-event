spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/big_event
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:password}
  data:
    redis:
      host: localhost
      port: 6379
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8


server:
  port: 3000
  servlet:
    context-path: /api

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  type-handlers-package: com.cshlands.mapper.handler

jwt:
  secret: ${JWT_SECRET:dev-only-secret-please-change-me-0123456789}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

